  r_slip:{t:'급여명세서가 이상할 때 확인하는 순서',lead:'금액이 예상과 다르면 항목별로 나눠서 보면 원인을 빨리 찾을 수 있습니다.',

 }},
tax:{t:'5월 종합소득세',start:'k',
 nodes:{k:{q:'연말정산 말고 다른 소득이 있었나요?',o:[['프리랜서·부업으로 3.3%를 떼고 받은 돈이 있습니다','r_free'],['월세·임대 수입이 있습니다','r_rent'],['이자·배당이 연 2천만 원을 넘습니다','r_fin'],['해 중에 회사를 옮겨 근무지가 두 곳 이상이었습니다','r_two'],['근로소득만 있고 연말정산을 마쳤습니다','r_none']]}},
 res:{

   steps:['연말정산 결과(원천징수영수증)를 확인합니다','빠뜨린 공제가 있는지 점검합니다','있다면 홈택스에서 경정청구를 합니다'],calc:['refund','경정청구로 얼마 돌려받는지 보기'],links:['hometax']},
  r_two:{t:'근무지가 여러 곳이면 합산해서 신고해야 합니다',lead:'중도에 퇴사하거나 이직했는데 전 직장 소득을 현 직장 연말정산에 합치지 않았다면, 다음 해 5월에 종합소득세로 합산 신고해야 합니다.',
   steps:['전 직장 근로소득 원천징수영수증을 받습니다','현 직장 연말정산 결과와 함께 홈택스에서 합산 신고합니다','지방소득세는 위택스에서 따로 신고합니다'],docs:['전 직장 근로소득 원천징수영수증','현 직장 원천징수영수증'],note:['기한을 넘기면 무신고 가산세가 붙을 수 있습니다. 가산세 계산기로 확인할 수 있습니다.'],calc:['penalty','기한을 놓쳤다면 가산세 계산'],links:['hometax']},
  r_free:{t:'3.3% 소득이 있으면 5월에 종합소득세를 신고합니다',lead:'프리랜서·부업 소득은 사업소득이라 다음 해 5월에 신고해야 합니다. 이미 낸 3%보다 실제 세금이 적으면 돌려받을 수 있습니다.',
   steps:['홈택스에서 지급명세서(받은 소득 내역)를 확인합니다','업종코드로 경비율을 조회하고 소득금액을 계산합니다','근로소득이 있으면 합산하고 공제를 입력합니다','홈택스에서 신고하고, 지방소득세는 위택스에서 따로 신고합니다'],docs:['지급명세서 조회 내역','경비 증빙(실제 경비 적용 시)','국민연금 납부 내역'],note:['신고하지 않으면 무신고 가산세 20%와 납부지연 이자가 붙을 수 있습니다.'],calc:['income','종합소득세 간이추정 열기'],links:['hometax']},
  r_rent:{t:'임대 수입은 5월 종합소득세 신고 대상입니다',lead:'월세나 임대 수입은 다음 해 5월에 신고합니다. 주택 임대의 분리과세 선택 여부 등은 요건이 복잡하니 홈택스나 세무서에서 확인하세요.',

   steps:['금융기관에서 이자·배당 소득 내역을 받습니다','홈택스에서 종합과세 대상인지 확인합니다','합산 신고하고 지방소득세도 신고합니다'],note:['이 포털의 계산기는 금융소득 종합과세를 계산하지 않습니다.'],links:['hometax']}
 }}
};
var $stage=document.getElementById('stage');
var sc=null,id=null,node=null,trail=[];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function focusStage(){$stage.focus({preventScroll:true});window.scrollTo({top:0})}
function pick(){
  sc=null;
  document.title='상황별 안내 · '+C.company+' '+C.team;
  $stage.innerHTML='<h1 class="q">어떤 상황인가요?</h1><ul class="opts">'+Object.keys(S).map(function(k){return '<li><button class="opt" data-s="'+k+'" style="--c:'+COLOR[k]+'" type="button">'+esc(S[k].t)+'<em aria-hidden="true">›</em></button></li>'}).join('')+'</ul>';
}
function recap(){return trail.length?'<ul class="recap" aria-label="내가 고른 답">'+trail.map(function(t){return '<li>'+esc(t.a)+'</li>'}).join('')+'</ul>':''}
function render(){
  if(!sc){pick();return}
  var n=sc.nodes[node];
  document.documentElement.style.setProperty('--c',COLOR[id]);
  if(n){
    $stage.innerHTML=recap()+'<h1 class="q">'+esc(n.q)+'</h1><ul class="opts">'+n.o.map(function(o,i){return '<li><button class="opt" data-i="'+i+'" type="button">'+esc(o[0])+'<em aria-hidden="true">›</em></button></li>'}).join('')+'</ul><p class="back"><button class="pill" data-act="back" type="button">← 이전 질문</button></p>';
    document.title=sc.t+' · '+C.company+' '+C.team;
  }else{
    var r=sc.res[node];
    var h='<div class="res card" style="--c:'+COLOR[id]+'"><h2 id="resT">'+esc(r.t)+'</h2><p class="leadp">'+esc(r.lead)+'</p>';
    if(r.steps||r.docs){h+='<div class="cols">';
      if(r.steps)h+='<div><h3>진행 순서</h3><ol>'+r.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol></div>';
      if(r.docs)h+='<div><h3>준비할 서류</h3><ul class="plain">'+r.docs.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ul></div>';
      h+='</div>'}
    if(r.note)h+='<div class="note"><b>확인할 점</b>'+r.note.map(function(s){return esc(s)}).join('<br>')+'</div>';
    if(r.links)h+='<div class="links2">'+r.links.map(function(k){return '<a href="'+L[k].u+'" target="_blank" rel="noopener">'+L[k].t+'</a>'}).join('')+'</div>';
    var subj='[인사팀 문의] '+sc.t+' - '+r.t;
    var body='안녕하세요. 포털에서 아래와 같이 선택했습니다.\n'+trail.map(function(t){return '- '+t.q+' → '+t.a}).join('\n')+'\n\n문의 내용: ';
    h+='<div class="actions">'+(r.calc?'<a class="btn" href="'+(r.calc[0].indexOf('.html')>-1?r.calc[0]:'calculators.html#'+r.calc[0])+'">'+esc(r.calc[1])+'</a>':'')+'<a class="btn'+(r.calc?' ghost':'')+'" href="mailto:'+C.email+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body)+'">인사팀에 문의하기</a><button class="btn ghost" data-act="restart" type="button">처음부터 다시</button></div></div>';
    $stage.innerHTML=recap()+h;
    document.title=r.t+' · '+C.company+' '+C.team;
  }
  focusStage();
}
function go(key){id=key;sc=S[key];node=sc.start;trail=[];history.replaceState(null,'','?s='+key);render()}
$stage.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.s){go(b.dataset.s);return}
  if(b.dataset.i!=null){var n=sc.nodes[node],o=n.o[+b.dataset.i];trail.push({q:n.q,a:o[0],prev:node});node=o[1];render();return}
  if(b.dataset.act==='back'){var t=trail.pop();if(t){node=t.prev}render();return}
  if(b.dataset.act==='restart'){sc=null;id=null;history.replaceState(null,'',location.pathname);pick();focusStage()}
});
var q=new URLSearchParams(location.search).get('s');
if(q&&S[q]){id=q;sc=S[q];node=sc.start;trail=[];render()}else{pick()}
})();
</script>
